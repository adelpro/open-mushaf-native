name: Greeting

on:
  pull_request:
    types: [opened]
  issues:
    types: [opened]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Greet on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issueNumber = context.issue.number;
            const greeting =
              'Thanks for opening this pull request! A maintainer will review it soon.';

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100,
            });

            const alreadyGreeted = comments.some((comment) =>
              comment.body?.includes(greeting),
            );

            if (!alreadyGreeted) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: greeting,
              });
            }

      - name: Greet on Issue
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issueNumber = context.issue.number;
            const greeting =
              'Thanks for opening this issue! Please include steps to reproduce and expected behavior.';

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: issueNumber,
              per_page: 100,
            });

            const alreadyGreeted = comments.some((comment) =>
              comment.body?.includes(greeting),
            );

            if (!alreadyGreeted) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: greeting,
              });
            }
