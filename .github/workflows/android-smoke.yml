name: Android Smoke (emulator)

# Boots a fresh Android emulator in the cloud, builds the debug APK, installs it,
# launches the app and FAILS if it does not reach the foreground.
#
# Scope: this is a "builds + launches on a device" smoke test. It does NOT replace
# ci.yml (lint / unit tests / type-check) or the EAS build workflows. iOS is not
# covered (needs a macOS runner). Free for public repos; draws Actions minutes on
# private repos.
#
# Triggers: manual (Actions tab -> Run workflow) and on every pull request.

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: android-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Build & launch on API 36 emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22'

      # The ubuntu runner already ships the Android SDK (ANDROID_HOME is preset),
      # it is just not on PATH. Do NOT use android-actions/setup-android@v3 here:
      # it runs `sdkmanager tools`, and the legacy 'tools' package was removed
      # from the SDK repository, so it fails with "Failed to find package 'tools'".
      - name: Set up Android SDK (use runner's preinstalled SDK)
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=$SDK"
          CMDLINE="$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | head -n1)"
          echo "cmdtools=$CMDLINE"
          echo "$CMDLINE" >> "$GITHUB_PATH"
          yes | "$CMDLINE/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # android/ is gitignored and generated by Expo - recreate it from app config.
      - name: Prebuild native project
        run: npx expo prebuild --platform android --no-install --clean

      # .env is not committed; give the build placeholder values so it has something.
      # Replace with repo secrets if the app needs real keys to boot.
      - name: Provide .env
        run: cp -n .env.example .env || true

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Required on Linux runners: without this the emulator has no KVM access and
      # never finishes booting (sys.boot_completed stays empty until the timeout).
      - name: Enable KVM (emulator hardware acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator and launch app
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # NOTE: android-emulator-runner runs each line as its own `sh -c`, so
          # multi-line shell constructs (if/then/fi, for/do/done) break. Keep every
          # line self-contained.
          script: |
            adb wait-for-device
            echo "Installing APK..."
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            echo "Launching com.adelpro.openmushafnative/.MainActivity ..."
            adb shell am start -W -n com.adelpro.openmushafnative/.MainActivity
            sleep 10
            adb exec-out screencap -p > screen.png || true
            adb logcat -d > logcat.txt || true
            adb shell dumpsys window displays | grep -iE "mCurrentFocus|mFocusedApp" || true
            test -n "$(adb shell pidof com.adelpro.openmushafnative | tr -d '\r')" || { echo "::error::App process not running after launch (crash on start?) - see logcat.txt artifact"; exit 1; }
            echo "OK: app process is running"

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-artifacts
          path: |
            screen.png
            logcat.txt
          if-no-files-found: ignore
