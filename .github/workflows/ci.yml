name: CI

on:
  pull_request:
    branches: [develop, staging, main]
  push:
    branches: [develop, staging, main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Package manager policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Require Yarn and reject competing lockfiles
        shell: bash
        run: |
          set -euo pipefail
          for lockfile in package-lock.json npm-shrinkwrap.json pnpm-lock.yaml bun.lock bun.lockb; do
            if [[ -e "$lockfile" ]]; then
              echo "::error::Unexpected lockfile found: $lockfile — this project uses yarn.lock only."
              exit 1
            fi
          done
          test -f yarn.lock
          grep -q '"packageManager": "yarn@' package.json

  lint-and-test:
    name: Lint and tests
    runs-on: ubuntu-latest
    needs: policy
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check code formatting
        run: yarn format:check

      - name: Run linter
        run: yarn lint

      - name: Run tests with coverage
        run: yarn test:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v5
        if: always()
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  type-check:
    name: Type check
    runs-on: ubuntu-latest
    needs: policy
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Type Check
        run: yarn type-check

  commitlint:
    name: Commit message checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: policy
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Validate pull request commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: yarn commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  build-check:
    name: Web build check
    runs-on: ubuntu-latest
    needs: policy
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build web export
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: yarn build
